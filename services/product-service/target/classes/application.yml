server:
  port: 8082

spring:
  application:
    name: product-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/products_db}
    username: ${SPRING_DATASOURCE_USERNAME:sti_user}
    password: ${SPRING_DATASOURCE_PASSWORD:sti_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

aws:
  endpoint-override: ${AWS_ENDPOINT_OVERRIDE:http://localhost:4566}
  region: ${AWS_REGION:us-east-1}
  s3:
    datalake-bucket: ${DATALAKE_BUCKET:sti-data-lake}

kafka:
  topics:
    product-created: product.created
    product-updated: product.updated

logging:
  level:
    com.scaletoinsight: DEBUG
